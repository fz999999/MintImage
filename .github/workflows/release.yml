name: Build and Release

# 只维护 Windows 端（见 AGENTS.md）：本仓库的发布包只构建 Windows x64。
#
# **不自动构建**：推 tag 不会触发 CI。发版流程是本地构建 + 打包 + 上传
# （scripts/package-windows.ps1 出 zip，再用 release 上传），
# 需要 CI 重建时在这里手动 Run workflow。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare build version
        shell: pwsh
        run: |
          # 手动触发时没有 ref_name 是 tag 的前提，版本号从 pubspec.yaml 取。
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          "APP_VERSION=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_NAME=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_NUMBER=${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: flutter pub get
      - run: flutter build windows --release --no-tree-shake-icons --build-name $env:BUILD_NAME --build-number $env:BUILD_NUMBER --dart-define "APP_VERSION=$env:APP_VERSION"

      - name: Archive Windows build
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../MintImage-windows-x64.zip .

      - uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: MintImage-windows-x64.zip
